{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

    <h2>Exam Reports</h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>Student</th>
                <th>Exam</th>
                <th>Score</th>
                <th>Date</th>
            </tr>
        </thead>

        <tbody>

            {% for result in results %}

            <tr>
                <td>{{ result.student.username }}</td>
                <td>{{ result.exam.title }}</td>
                <td>{{ result.score }}</td>
                <td>{{ result.created_at }}</td>
            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
