{% extends 'base.html' %}

{% block content %}

<h2>Login</h2>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <input type="text"
               name="username"
               placeholder="Username"
               class="form-control">
    </div>

    <div class="mb-3">
        <input type="password"
               name="password"
               placeholder="Password"
               class="form-control">
    </div>

    <button class="btn btn-primary">
        Login
    </button>

</form>

{% endblock %}
