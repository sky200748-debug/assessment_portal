{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">Dashboard</h2>

<div class="row">

    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h5>Total Categories</h5>
                <h1>{{ total_categories }}</h1>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h5>Total Exams</h5>
                <h1>{{ total_exams }}</h1>
            </div>
        </div>
    </div>

    <div class="col-md-4">
        <div class="card text-center">
            <div class="card-body">
                <h5>Total Questions</h5>
                <h1>{{ total_questions }}</h1>
            </div>
        </div>
    </div>

</div>

<hr class="my-5">

<h3>Portal Statistics</h3>

<canvas id="myChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const ctx = document.getElementById('myChart');

new Chart(ctx, {
    type: 'bar',
    data: {
        labels: ['Categories', 'Exams', 'Questions'],
        datasets: [{
            label: 'Portal Statistics',
            data: [
                {{ total_categories }},
                {{ total_exams }},
                {{ total_questions }}
            ]
        }]
    },
    options: {
        responsive: true,
        scales: {
            y: {
                beginAtZero: true
            }
        }
    }
});
</script>

{% endblock %}
